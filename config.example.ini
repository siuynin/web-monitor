; ===== CẤU HÌNH WEBSITE MONITOR =====
; Sửa file này khi tool đang chạy cũng được, lượt kiểm tra sau sẽ áp dụng.

[monitor]
; File Excel chứa danh sách website (mỗi ô có dạng tên miền/URL đều được kiểm tra)
excel_file = website serve.xlsx
; Tên sheet, để trống = sheet đầu tiên
sheet =
; Bao lâu kiểm tra 1 lần (giây)
interval_seconds = 60
; Thời gian chờ tối đa 1 website phản hồi (giây)
timeout_seconds = 15
; Khi lỗi, kiểm tra lại thêm bao nhiêu lần trước khi báo (tránh báo nhầm do mạng chập chờn)
retries = 2
retry_delay_seconds = 5
; Báo "phản hồi chậm" nếu quá số ms này (0 = tắt). Chỉ ghi chú, không gửi email
slow_threshold_ms = 0
; Website lỗi kéo dài thì gửi email nhắc lại sau mỗi bao nhiêu phút (0 = không nhắc)
remind_minutes = 60
; Mỗi domain chỉ gửi tối đa bấy nhiêu email lỗi cho 1 lần sự cố (tính cả email đầu tiên, 0 = không giới hạn).
; Khi domain hoạt động lại, bộ đếm được đặt lại.
max_alerts_per_domain = 5
; Số website kiểm tra song song
workers = 20

[email]
enabled = true
; Gmail: smtp.gmail.com, port 587, use_ssl = false, password là "Mật khẩu ứng dụng" (App Password)
; Gmail/Google Workspace -> https://myaccount.google.com/apppasswords (cần bật xác minh 2 bước)
; Nếu dùng port 465 thì đặt use_ssl = true
smtp_host = smtp.gmail.com
smtp_port = 587
use_ssl = false
username = your-account@gmail.com
password = xxxx xxxx xxxx xxxx
from_addr =
from_name = Website Monitor
; Người nhận cảnh báo, nhiều email cách nhau bởi dấu phẩy
to = admin@example.com, kythuat@example.com
; Gửi email khi website hoạt động lại
notify_recovery = true
