name: Website Monitor

# Mỗi lượt chạy kiểm tra liên tục mỗi 60 giây trong ~5 giờ 40 phút, rồi tự khởi động lượt kế tiếp.
# (Lịch cron của GitHub rất thất thường - có khi vài tiếng mới chạy 1 lần - nên không dựa vào nó.)
# Lịch cron bên dưới chỉ để dự phòng: khởi động lại nếu chuỗi bị đứt.
# Muốn dừng hẳn: tab Actions > Website Monitor > "..." > Disable workflow.

on:
  schedule:
    - cron: "23 */2 * * *"   # dự phòng, 2 tiếng/lần
  workflow_dispatch:          # bấm "Run workflow" để khởi động lại / gửi email thử
    inputs:
      test_email:
        description: "Chỉ gửi email thử (kiểm tra Secrets SMTP), không kiểm tra website"
        type: boolean
        default: false

permissions:
  contents: write            # lưu state.json / history.csv về repo
  actions: write             # tự khởi động lượt chạy kế tiếp

concurrency:
  # chỉ 1 lượt giám sát chạy cùng lúc; email thử chạy riêng, không phải chờ
  group: website-monitor${{ inputs.test_email && '-test' || '' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Secrets SMTP đang được lưu trong Environment này (Settings > Environments)
    environment: SMTP_USERNAME
    timeout-minutes: 355
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kiểm tra website
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MONITOR_SAVE_CMD: bash .github/save-state.sh
          MONITOR_SYNC_CMD: git pull -q --rebase --autostash origin ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python monitor.py --test-email
          else
            python monitor.py --duration 20400   # 5 giờ 40 phút
          fi

      - name: Lưu trạng thái
        if: always() && inputs.test_email != true
        run: bash .github/save-state.sh

      - name: Khởi động lượt kế tiếp
        # không chạy khi bị huỷ tay -> bấm Cancel là dừng được chuỗi
        if: (success() || failure()) && inputs.test_email != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
